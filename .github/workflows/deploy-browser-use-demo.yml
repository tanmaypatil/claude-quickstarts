name: Deploy browser-use demo to Fly.io
on:
  workflow_dispatch:
jobs:
  diag:
    runs-on: ubuntu-latest
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
    steps:
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - run: flyctl status --app browser-use-tanmaypatil || true
      - run: flyctl logs --app browser-use-tanmaypatil --no-tail | tail -n 200 || true
      - run: |
          flyctl ssh console --app browser-use-tanmaypatil -C "bash -lc 'uptime; free -m; ps -eo pid,etime,rss,args --sort=-rss | head -25; echo ---x11vnc; pgrep -a x11vnc; tail -30 /tmp/x11vnc_stderr.log; echo ---novnc; tail -40 /tmp/novnc.log; echo ---streamlit; tail -30 /tmp/streamlit_stdout.log; echo ---dmesg; sudo dmesg 2>/dev/null | grep -i -E \"oom|killed\" | tail; ss -tnp 2>/dev/null | head -30'" || true
