# Single public entry point for the hosted demo (Fly.io). Started by entrypoint.sh
# only when DEMO_PASSWORD is set. Everything except /healthz needs the password.
worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events { worker_connections 256; }

http {
    include /etc/nginx/mime.types;
    access_log off;
    client_body_temp_path /tmp/nginx_body;
    proxy_temp_path /tmp/nginx_proxy;
    fastcgi_temp_path /tmp/nginx_fastcgi;
    uwsgi_temp_path /tmp/nginx_uwsgi;
    scgi_temp_path /tmp/nginx_scgi;
    client_max_body_size 50m;
    keepalive_timeout 15s;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen 8000;

        auth_basic "Browser Use Demo";
        auth_basic_user_file /tmp/demo.htpasswd;

        location = /healthz {
            auth_basic off;
            return 200 "ok\n";
        }

        location = / {
            root /home/browseruse/static_content;
            try_files /hosted.html =404;
        }

        # Streamlit runs with server.baseUrlPath=streamlit, so the path passes through unchanged.
        location /streamlit/ {
            proxy_pass http://127.0.0.1:8501;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_read_timeout 1d;
            proxy_buffering off;
        }

        # noVNC and its websocket, with the /vnc prefix stripped.
        location /vnc/ {
            proxy_pass http://127.0.0.1:6080/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_read_timeout 1d;
            proxy_buffering off;
        }
    }
}
